# Log rotation for the relay on macOS, via newsyslog(8).
#
# Install: sudo cp streamplayer-relay.newsyslog.conf /etc/newsyslog.d/streamplayer-relay.conf
# newsyslog runs from the system's periodic launchd job already; no further
# setup needed. Verify with: sudo newsyslog -nv | grep streamplayer
#
# logfilename                          [owner:group]  mode count size(KB) when flags
/opt/streamplayer-relay/logs/relay.log              644  7     5000     *     J
/opt/streamplayer-relay/logs/relay.err.log          644  7     5000     *     J
