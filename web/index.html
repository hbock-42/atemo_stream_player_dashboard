<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by `flutter build web --base-href`. The relay serves this bundle
    from the root of its own origin, so the default is what ships.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="See and control what's playing on the office Streamplayer.">

  <!--
    Without this, mobile browsers render at a 980px virtual width and scale
    down — every layout decision the app makes about a 360px phone would be
    made against the wrong number (WEB-03). viewport-fit=cover lets the app
    paint under the notch; the screen reads the real insets from MediaQuery.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Matches AppColors.dark.background (#0E0E11), so browser chrome, the
       status bar and the launch background are the same colour as the app and
       there is no white flash on open. -->
  <meta name="theme-color" content="#0E0E11">

  <!-- Add-to-home-screen (WEB-04). `mobile-web-app-capable` is the modern
       spelling; iOS still reads the apple- prefixed one, and both are needed
       for a home-screen launch with no browser chrome. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Streamplayer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Streamplayer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page never scrolls or bounces: the app is one screen and handles
       its own scrolling. Background matches the app so the pre-Flutter frame
       is invisible. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0E0E11;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <!--
    WEB-04 — deliberately NO service worker.

    A service worker would cache the bundle, and the relay is redeployed by
    someone on the LAN with no version discipline and no way to tell a dozen
    phones to hard-refresh. A stale cached bundle talking to a newer relay is a
    support call nobody wants, and offline support is meaningless anyway: this
    page is worthless without the relay it was served by, which lives on the
    same LAN. See web/flutter_bootstrap.js, which loads Flutter without
    serviceWorkerSettings and unregisters anything a previous deploy left
    behind.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
