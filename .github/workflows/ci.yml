name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  build:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5


      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      # One resolve covers both packages: the relay is a workspace member.
      # Before that was true, analyze ran ahead of the relay's own pub get and
      # reported every symbol in relay/test as undefined.
      - name: Workspace — pub get (app + relay)
        run: flutter pub get

      - name: App — flutter analyze (failing, not advisory)
        run: flutter analyze --fatal-infos

      - name: App — flutter test
        run: flutter test

      - name: Relay — dart analyze
        run: cd relay && dart analyze

      - name: Relay — dart test
        run: cd relay && dart test

      - name: Architecture guard (tool/check_layers.sh)
        run: ./tool/check_layers.sh

      # The real guard against dart:io leaking into the browser bundle
      # (ADR-0005): a leak fails this build at compile time, not at review time.
      - name: Web — flutter build web
        run: flutter build web


  # iOS needs a macos runner, which is slow and far more expensive than the
  # ubuntu job above. It is split into its own job so it never blocks the
  # fast feedback loop the main job gives on every push/PR: it only runs on
  # pushes to main, and its failure does not fail the workflow
  # (continue-on-error), since main's mergeability must not depend on a slow,
  # non-authoritative build. Bump this if it starts hiding real breakage.
